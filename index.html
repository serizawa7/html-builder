<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HTML Builder</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CodeMirror -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css"
  />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/xml/xml.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="editorPage">

    <!-- =========================
         サイドバー
    ========================= -->

    <aside class="sidebar">

      <div class="logo-area">

        <div class="logo-mark">
          ✦
        </div>

        <div class="logo-text">

          <strong>
            HTML Builder
          </strong>

          <span>
            Page Design Tool
          </span>

        </div>

      </div>


      <div class="menu-label">
        ELEMENTS
      </div>


      <button class="side-menu active">

        <span class="menu-icon">
          T
        </span>

        <span>
          テキスト
        </span>

      </button>


      <button class="side-menu">

        <span class="menu-icon">
          ▦
        </span>

        <span>
          レイアウト
        </span>

      </button>


      <button class="side-menu">

        <span class="menu-icon">
          □
        </span>

        <span>
          ボックス
        </span>

      </button>


      <button class="side-menu">

        <span class="menu-icon">
          ▧
        </span>

        <span>
          画像
        </span>

      </button>


      <button class="side-menu">

        <span class="menu-icon">
          ✦
        </span>

        <span>
          装飾
        </span>

      </button>


      <button class="side-menu">

        <span class="menu-icon">
          ♡
        </span>

        <span>
          デザイン
        </span>

      </button>


      <div class="sidebar-bottom">

        <div class="tip-card">

          <span class="tip-icon">
            💡
          </span>

          <div>

            <strong>
              Let's create!
            </strong>

            <p>
              パーツを選んで<br>
              ページを作ろう
            </p>

          </div>

        </div>

      </div>

    </aside>


    <!-- =========================
         メインエリア
    ========================= -->

    <main class="main-area">


      <!-- =========================
           パーツパネル
      ========================= -->

      <section class="panel">

        <div class="panel-header">

          <div>

            <span class="panel-kicker">
              ELEMENTS
            </span>

            <h2 id="panelTitle">
              テキスト
            </h2>

          </div>

          <div class="panel-decoration">
            ✦
          </div>

        </div>


        <p class="panel-description">
          使いたいパーツを選んでください
        </p>


        <div id="panelContent"></div>

      </section>


      <!-- =========================
           パネル・エディタ間
      ========================= -->

      <div
        class="resize-divider"
        data-divider="panel-editor"
      >
        <span></span>
      </div>


      <!-- =========================
           HTMLエディタ
      ========================= -->

      <section class="editor">

        <div class="section-header">

          <div>

            <span class="section-kicker">
              HTML EDITOR
            </span>

            <h3>
              コードを編集
            </h3>

          </div>

          <span class="status-dot">
            ● 編集中
          </span>

        </div>


        <div class="editor-wrapper">

          <textarea id="editorText"></textarea>

        </div>


        <button class="copy">

          <span>
            ⌘
          </span>

          HTMLをコピー

        </button>

      </section>


      <!-- =========================
           エディタ・プレビュー間
      ========================= -->

      <div
        class="resize-divider"
        data-divider="editor-preview"
      >
        <span></span>
      </div>


      <!-- =========================
           プレビュー
      ========================= -->

      <section class="preview-content">

        <div class="preview-header">

          <div>

            <span class="section-kicker">
              LIVE PREVIEW
            </span>

            <h3>
              プレビュー
            </h3>

          </div>


          <div class="preview-switch">

            <button
              id="previewPcBtn"
              class="preview-mode-btn active"
              type="button"
            >
              🖥 PC
            </button>

            <button
              id="previewMobileBtn"
              class="preview-mode-btn"
              type="button"
            >
              📱 スマホ
            </button>

          </div>

        </div>


        <!-- PC -->

        <div class="pc-stage">

          <div class="device-label">

            <span>
              PC PREVIEW
            </span>

            <span>
              1280px
            </span>

          </div>


          <div class="pc-device">

            <div class="browser-bar">

              <div class="browser-dots">

                <span></span>
                <span></span>
                <span></span>

              </div>

              <div class="browser-address">
                preview.html
              </div>

            </div>


            <div
              class="pc-preview"
              id="pcPreview"
            ></div>

          </div>

        </div>


        <!-- スマホ -->

        <div class="mobile-stage">

          <div class="device-label">

            <span>
              SMARTPHONE PREVIEW
            </span>

            <span>
              375px
            </span>

          </div>


          <div class="mobile-device">

            <div class="mobile-camera"></div>


            <div
              class="mobile-preview"
              id="mobilePreview"
            ></div>

          </div>

        </div>

      </section>

    </main>

  </div>


  <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HTML Builder</title>

  <!-- CSSを読み込む -->
  <link rel="stylesheet" href="style.css">

</head>


<body>


  <!-- =========================
       上部ヘッダー
  ========================== -->

  <header class="top-header">

    <div class="logo">
      🌸 <span>HTML Builder</span>
    </div>


    <div class="header-menu">

      <button>ファイル</button>

      <button>編集</button>

      <button>表示</button>

    </div>


    <div class="header-actions">

      <button>↶</button>

      <button>↷</button>

      <button class="save-btn">
        💾 保存
      </button>

    </div>

  </header>



  <!-- =========================
       メインエリア
  ========================== -->

  <div class="main-container">


    <!-- =====================
         左サイドバー
    ====================== -->

    <aside class="sidebar">


      <button class="side-menu active">

        <span class="icon">
          🏠
        </span>

        <span>
          ホーム
        </span>

      </button>



      <button class="side-menu">

        <span class="icon">
          🧩
        </span>

        <span>
          テンプレート
        </span>

      </button>



      <button class="side-menu">

        <span class="icon">
          T
        </span>

        <span>
          テキスト
        </span>

      </button>



      <button class="side-menu">

        <span class="icon">
          🖼️
        </span>

        <span>
          画像
        </span>

      </button>



      <button class="side-menu">

        <span class="icon">
          🎨
        </span>

        <span>
          装飾
        </span>

      </button>



      <button class="side-menu">

        <span class="icon">
          🔗
        </span>

        <span>
          リンク
        </span>

      </button>


    </aside>



    <!-- =====================
         ツールパネル
    ====================== -->

    <aside class="tool-panel">


      <div class="panel-header">

        <h2>
          テキスト
        </h2>

        <button>
          ×
        </button>

      </div>



      <!-- テキスト -->

      <div class="panel-section">

        <h3>
          テキストを追加
        </h3>


        <button class="add-text">

          ＋ 見出しを追加

        </button>


        <button class="add-text">

          ＋ 小見出しを追加

        </button>


        <button class="add-text">

          ＋ 本文を追加

        </button>

      </div>



      <hr>



      <!-- 装飾 -->

      <div class="panel-section">

        <h3>
          装飾
        </h3>


        <button id="boldBtn">

          🅱 太字

        </button>


        <button id="underlineBtn">

          U 下線

        </button>


        <button id="linkBtn">

          🔗 リンク

        </button>

      </div>



      <hr>



      <!-- おすすめパーツ -->

      <div class="panel-section">

        <h3>
          おすすめパーツ
        </h3>


        <button>
          📢 お知らせ
        </button>


        <button>
          ⚠️ 注意
        </button>


        <button>
          📝 メモ
        </button>


        <button>
          ⭐ ポイント
        </button>

      </div>


    </aside>



    <!-- =====================
         中央編集エリア
    ====================== -->

    <main class="workspace">


      <!-- 編集ツールバー -->

      <div class="workspace-toolbar">


        <button>
          ↶
        </button>


        <button>
          ↷
        </button>


        <span class="divider"></span>


        <button>
          💻 PC
        </button>


        <button>
          📱 スマホ
        </button>


      </div>



      <!-- キャンバス -->

      <div class="canvas-area">


        <div class="page">


          <textarea
            id="editorText"
            placeholder="ここに文章を入力してください">
          </textarea>


        </div>


      </div>



      <!-- ページ操作 -->

      <div class="page-control">


        <div class="page-number">

          1

        </div>


        <button class="add-page">

          ＋

        </button>


      </div>


    </main>



    <!-- =====================
         右側プレビュー
    ====================== -->

    <aside class="preview-panel">


      <div class="preview-header">


        <h2>
          プレビュー
        </h2>


        <button class="copy">

          📋 HTMLをコピー

        </button>


      </div>



      <!-- PC / スマホ切り替え -->

      <div class="preview-tabs">


        <button class="preview-tab active">

          💻 PC

        </button>


        <button class="preview-tab">

          📱 スマホ

        </button>


      </div>



      <!-- プレビュー -->

      <div class="preview-content">


        <div class="pc-preview">

          <div id="pcPreview"></div>

        </div>



        <div class="mobile-preview">

          <div id="mobilePreview"></div>

        </div>


      </div>


    </aside>


  </div>



  <!-- =========================
       JavaScriptを読み込む
  ========================== -->

  <script src="script.js"></script>


</body>

</html>
